name: Remote acoustic experiment tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/remote-acoustic/**'
      - '.github/workflows/remote-acoustic-tests.yml'
      - '.github/workflows/yanjaro-remote-train.yml'

permissions:
  contents: read
concurrency:
  group: remote-acoustic-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/remote-acoustic
    env:
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install experiment test dependencies
        run: python -m pip install --disable-pip-version-check '.[train,serve,test]'
      - name: All experiment tests (synthetic fixtures, no Yambda or training job)
        run: timeout --kill-after=10s 120s python -m pytest -q -o faulthandler_timeout=30
      - name: Validate notebook structure without execution
        run: python scripts/validate_notebook.py
