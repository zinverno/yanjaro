name: Acoustic similarity CPU

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/acoustic-similarity/**'
      - '.github/workflows/acoustic-similarity.yml'

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/acoustic-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  groove-pilot:
    # Explicit manual "Re-run all jobs" of this PR run is the only training trigger.
    # workflow_dispatch requires main registration; main stays untouched.
    if: >-
      github.run_attempt == '2' &&
      github.event.pull_request.number == 10 &&
      github.event.pull_request.head.repo.full_name == 'zinverno/yanjaro' &&
      github.event.pull_request.head.ref == 'experiment/acoustic-similarity-v01' &&
      github.triggering_actor == 'zinverno'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/acoustic-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: One CPU experiment, at most 512 MiB dataset acquisition
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          ulimit -v 4194304
          ulimit -t 600
          timeout 15m python -m acoustic_similarity.rhythm run --plan datasets/groove-cohort.json --output runs/groove-cpu-v1
      - name: Preserve weights, held-out metrics, provenance and actual resource receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groove-cpu-v1-${{ github.event.pull_request.head.sha }}
          path: experiments/acoustic-similarity/runs/groove-cpu-v1/
          if-no-files-found: error
          retention-days: 90
