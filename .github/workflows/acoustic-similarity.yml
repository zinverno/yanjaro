name: Acoustic similarity CPU

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/acoustic-similarity/**'
      - '.github/workflows/acoustic-similarity.yml'

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  NUMBA_NUM_THREADS: '2'
  PYTHONHASHSEED: '0'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/acoustic-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  groove-pilot:
    # The one authorized run (38127275492, attempt 2) is complete.
    # Re-enabling real acquisition/training requires a separately approved change.
    if: ${{ false }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/acoustic-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: One CPU experiment, at most 512 MiB dataset acquisition
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          ulimit -v 4194304
          ulimit -t 600
          timeout 15m python -m acoustic_similarity.rhythm run --plan datasets/groove-cohort.json --output runs/groove-cpu-v1
      - name: Preserve weights, held-out metrics, provenance and actual resource receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: groove-cpu-v1-${{ github.event.pull_request.head.sha }}
          path: experiments/acoustic-similarity/runs/groove-cpu-v1/
          if-no-files-found: error
          retention-days: 90

  cap2-pilot:
    # Explicit user authorization: only workflow run number 5, first attempt, PR #10.
    # Later pushes get a new run number; reruns increment run_attempt and cannot train.
    if: >-
      ${{ github.run_number == 5 && github.run_attempt == 1 &&
          github.event_name == 'pull_request' && github.event.action == 'synchronize' &&
          github.event.pull_request.number == 10 &&
          github.event.pull_request.head.repo.full_name == 'zinverno/yanjaro' &&
          github.event.pull_request.head.ref == 'experiment/acoustic-similarity-v01' }}
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_RETRIES: '0'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch authorized public source once, without checkout action retries
        run: |
          git init .
          git remote add origin https://github.com/zinverno/yanjaro.git
          git -c protocol.version=2 fetch --no-tags --depth=2 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 15e911d829a6f3683129de2bfcac37e47f55e995
      - name: Use pinned preinstalled Python, with no runtime download fallback
        run: |
          test -x "$RUNNER_TOOL_CACHE/Python/3.12.13/x64/bin/python3"
          echo "$RUNNER_TOOL_CACHE/Python/3.12.13/x64/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies without retries
        working-directory: experiments/acoustic-similarity
        run: |
          python3 -m pip install --retries 0 --timeout 30 --require-hashes --only-binary=:all: -r requirements.lock
          python3 -m pip install --no-index --no-deps --no-build-isolation -e .
          python3 -m pip check
      - name: One cap2 fit and held-out evaluation, at most 42 MiB research transfers
        working-directory: experiments/acoustic-similarity
        run: |
          ulimit -v 4194304
          ulimit -t 600
          timeout --kill-after=10s 540s python3 -m acoustic_similarity.cap2 run
