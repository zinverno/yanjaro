[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yanjaro-remote-acoustic"
version = "0.1.0"
description = "Research-only remote acoustic preference ranker for Yanjaro"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
train = ["pyarrow>=17,<26"]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.26,<1"]

[project.scripts]
yanjaro-remote-ml = "remote_acoustic.cli:main"

[tool.setuptools.packages.find]
include = ["remote_acoustic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
