[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yanjaro-acoustic-similarity"
version = "0.1.0"
description = "Isolated acoustic similarity research, not a preference model"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "librosa==0.11.0", "soundfile==0.13.1", "mido==1.3.3"]

[project.scripts]
yanjaro-similarity = "acoustic_similarity.cli:main"
yanjaro-rhythm = "acoustic_similarity.rhythm:main"

[tool.setuptools.packages.find]
include = ["acoustic_similarity*"]
